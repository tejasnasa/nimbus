name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Mirrors the committed .env.test, so Prisma's config and Vitest resolve the same
# values locally and in CI. The service containers below publish these ports.
env:
  DATABASE_URL: "postgresql://nimbus:nimbus@localhost:5434/nimbus_test"
  REDIS_URL: "redis://localhost:6381"
  LIVEKIT_URL: "ws://localhost:7880"
  LIVEKIT_API_KEY: "devkey"
  LIVEKIT_API_SECRET: "secret"

jobs:
  lint-typecheck:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # `api`, `web` and `ui` all declare both scripts. `check-types` runs
      # `dependsOn: ["^build"]`, so this also builds `@nimbus/db` first — the one
      # workspace that resolves through `dist` rather than source.
      - name: Typecheck
        run: npx turbo run check-types --affected
      # Both `apps/web` and `apps/api` lint against a `--max-warnings` budget
      # (a ratchet: lowering it is welcome, raising it is not), so a new warning
      # fails this step.
      - name: Lint
        run: npx turbo run lint --affected

  api-tests:
    name: API (smoke · unit · integration · security)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nimbus
          POSTGRES_PASSWORD: nimbus
          POSTGRES_DB: nimbus_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U nimbus -d nimbus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6381:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      livekit:
        image: livekit/livekit-server:latest
        env:
          # The development key pair, as in docker-compose.test.yml. A service
          # container cannot be given `--dev`, so the same settings arrive as env.
          LIVEKIT_KEYS: "devkey: secret"
          LIVEKIT_CONFIG: |
            rtc:
              tcp_port: 7881
              udp_port: 7882
              node_ip: 127.0.0.1
        ports:
          - 7880:7880
          - 7881:7881
          - 7882:7882/udp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply the Prisma schema to the test database
        run: npx turbo run db:deploy --filter=@nimbus/db
      - run: npx turbo run test:coverage --filter=api
      # Fixed per-package minimums, a few points under the measured numbers, so
      # only a real drop fails. See scripts/check-coverage.mjs.
      - name: Coverage floor
        run: node scripts/check-coverage.mjs apps/api

  web-tests:
    name: Web (unit · component)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx turbo run test:coverage --filter=web
      - name: Coverage floor
        run: node scripts/check-coverage.mjs apps/web

  package-tests:
    name: Shared packages
    runs-on: ubuntu-latest
    # `@nimbus/db` asserts schema and constraint behaviour against a real
    # Postgres, so this job needs the same service containers as `api-tests`.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nimbus
          POSTGRES_PASSWORD: nimbus
          POSTGRES_DB: nimbus_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U nimbus -d nimbus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6381:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply the Prisma schema to the test database
        run: npx turbo run db:deploy --filter=@nimbus/db
      - run: >-
          npx turbo run test:coverage
          --filter=@nimbus/utils
          --filter=@nimbus/ui
          --filter=@nimbus/db
          --filter=agent
      - name: Coverage floor
        run: >-
          node scripts/check-coverage.mjs
          packages/utils
          packages/ui
          packages/database
          apps/agent
