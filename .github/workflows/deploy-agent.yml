name: Deploy voice agent

# Ships the voice agent to LiveKit Cloud. Like the API deploy, this waits for CI
# on `main` to pass rather than racing it, and deploys the exact commit CI
# judged.
#
# `workflow_run` carries no path filter, so the job works out for itself whether
# anything the agent bundle is built from changed since the previous green CI
# run on `main`. Comparing against the previous green run (not the parent
# commit) means a change that landed while CI was red still ships with the next
# green run. A manual run always deploys.
#
# The agent's runtime settings (`NIMBUS_API_URL`, `NIMBUS_AGENT_SECRET`, the
# free-tier keys) are LiveKit Cloud secrets on the agent, set once with
# `lk agent update-secrets`; a deploy keeps them. This workflow only needs the
# project credentials, from the repository secrets `LIVEKIT_URL`,
# `LIVEKIT_API_KEY` and `LIVEKIT_API_SECRET`.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# A half-finished agent deploy is never cancelled for a newer one; they queue.
concurrency:
  group: deploy-agent
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  LK_CLI_VERSION: "2.19.3"

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Did the agent change?
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The newest successful CI run on main that is not this commit.
          previous=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI \
            --branch main --status success --limit 20 --json headSha \
            --jq "[.[].headSha | select(. != \"$HEAD_SHA\")][0] // empty")
          if [ -z "$previous" ] || ! git cat-file -e "$previous^{commit}" 2>/dev/null; then
            echo "No earlier green run to compare with; deploying."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$previous" "$HEAD_SHA" -- \
              apps/agent packages/types packages/utils \
              .github/workflows/deploy-agent.yml; then
            echo "Nothing the agent is built from changed since $previous."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.changes.outputs.deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The bundle inlines the workspace packages, so it is built here from the
      # whole monorepo; the image LiveKit builds only copies `dist`.
      - name: Build the agent bundle
        if: steps.changes.outputs.deploy == 'true'
        run: |
          npm ci
          npm run build -w agent

      - name: Install the LiveKit CLI
        if: steps.changes.outputs.deploy == 'true'
        run: |
          archive="lk_${LK_CLI_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/livekit/livekit-cli/releases/download/v${LK_CLI_VERSION}"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/checksums.txt"
          grep " $archive\$" checksums.txt | sha256sum -c -
          tar -xzf "$archive" lk
          sudo install lk /usr/local/bin/lk
          lk --version

      - name: Deploy to LiveKit Cloud
        if: steps.changes.outputs.deploy == 'true'
        working-directory: apps/agent
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        run: lk agent deploy --yes .
