# Test infrastructure for the Nimbus test suite.
#
# Brings up real Postgres + Redis, which the integration and smoke suites
# require (see plans: Postgres and Redis are never mocked, only external APIs
# like Groq/OpenAI/Resend are).
#
# Host ports are deliberately offset (+1) from the 5433/6380 convention used
# by the sibling Illume project's test containers, which may already be
# running on a developer machine. 5433/6380 are NOT free on this machine.
#
#   docker compose -f docker-compose.test.yml up -d
#   DATABASE_URL  -> postgresql://nimbus:nimbus@localhost:5434/nimbus_test
#   REDIS_URL     -> redis://localhost:6381
#
# Credentials here are throwaway local-only values, not secrets.

services:
  postgres-test:
    image: postgres:16
    container_name: nimbus-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: nimbus
      POSTGRES_PASSWORD: nimbus
      POSTGRES_DB: nimbus_test
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nimbus -d nimbus_test"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - nimbus-postgres-test-data:/var/lib/postgresql/data

  redis-test:
    image: redis:7
    container_name: nimbus-redis-test
    restart: unless-stopped
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  nimbus-postgres-test-data:
